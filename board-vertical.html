<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HIGH FIVE AI 2026 · 행사 종료</title>
<style>
  :root { --blue: #2443e6; --lime: #dcf52a; --ink: #0f1a6b; --bg: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; overflow: hidden; position: relative; }
  .b { position: fixed; border-radius: 50%; z-index: 0; }
  .b1 { left: -90px; top: -80px; width: 260px; height: 220px; background: var(--blue); }
  .b2 { right: -70px; bottom: -60px; width: 220px; height: 240px; background: var(--lime); }
  main { position: relative; z-index: 1; max-width: 420px; }
  .tag { display: inline-block; font-weight: 900; font-size: 13px; letter-spacing: .12em; color: var(--blue); border: 3px solid var(--ink); border-radius: 6px; padding: 6px 12px; box-shadow: 4px 4px 0 var(--lime), 4px 4px 0 3px var(--ink); }
  h1 { font-size: 34px; line-height: 1.25; margin: 26px 0 12px; font-weight: 900; }
  p { font-size: 16px; line-height: 1.6; margin: 0; color: #34406f; }
</style>
</head>
<body>
  <i class="b b1"></i><i class="b b2"></i>
  <main>
    <span class="tag">HIGH FIVE AI 2026</span>
    <h1>행사가 종료되었습니다</h1>
    <p>Hi-Five AI 페스티벌 &lt;투자왕을 찾아라&gt;에<br>참여해 주셔서 감사합니다.</p>
  </main>
</body>
</html>
